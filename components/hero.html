<section
  class="relative overflow-hidden min-h-[640px] flex items-stretch"
  style="
    background: linear-gradient(
      135deg,
      #dff0f7 0%,
      #eaf6f0 50%,
      #f5faf7 100%
    );
  "
>
  <!-- Grid background -->
  <div
    class="absolute inset-0 pointer-events-none z-0"
    style="
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.045) 1px, transparent 1px);
      background-size: 60px 60px;
    "
  ></div>

  <div
    class="relative z-10 w-full max-w-8xl mx-auto grid grid-cols-1 lg:grid-cols-2 items-center gap-12 px-5 py-14 sm:px-8 lg:px-16"
  >
    <!-- LEFT -->
    <div
      class="flex flex-col items-center lg:items-start text-center lg:text-left gap-5"
    >
      <!-- Badge -->
      <div
        class="inline-flex items-center gap-2 rounded-full px-4 py-2 text-[13px] font-medium text-[#1a2e3b] border border-[#1a2e3b]/30 bg-white/35 backdrop-blur-md shadow-[0_4px_18px_rgba(15,23,42,0.06)]"
      >
        <svg class="w-[15px] h-[15px]" viewBox="0 0 15 15" fill="none">
          <path
            d="M7.5 1.5L2 3.5V8C2 11.2 4.5 14.1 7.5 14.5C10.5 14.1 13 11.2 13 8V3.5L7.5 1.5Z"
            stroke="#22c55e"
            stroke-width="1.3"
            fill="none"
          />
          <path
            d="M5 7.5l2 2 3-3"
            stroke="#22c55e"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Secured Transaction
      </div>

      <!-- Headline -->
      <h1
        class="text-[clamp(34px,5vw,49px)] font-[500] text-[#0d1b2a] leading-[1] tracking-[0.8px] max-w-[700px]"
      >
        Transact With Confidence
      </h1>

      <!-- Subtext -->
      <p
        class="text-[20px] sm:text-[18px] text-[#2B353F] leading-relaxed max-w-[560px] tracking-[0.03em]"
      >
        We safely hold payments until both parties confirm the deal is
        completed.
      </p>

      <!-- CTA buttons -->
      <div class="flex flex-wrap justify-center lg:justify-start gap-3 pt-2">
        <a
          href="#"
          class="inline-flex items-center gap-2.5 rounded-full bg-[#2A52BE] px-6 py-3 text-[#F7F7F8] text-[16px] font-medium transition-all hover:bg-[#1a2e3b] hover:-translate-y-px shadow-[0_10px_24px_rgba(37,99,235,0.22)]"
        >
          <svg class="w-[18px] h-[18px]" viewBox="0 0 18 18" fill="white">
            <path d="M3 2.5l9.5 6.5L3 15.5V2.5z" />
          </svg>

          <div class="w-px h-[18px] bg-white/40"></div>

          Google Play
        </a>

        <a
          href="#"
          class="inline-flex items-center gap-2.5 rounded-full bg-[#2A52BE] px-6 py-3 text-[#F7F7F8] text-[16px] font-medium transition-all hover:bg-[#1a2e3b] hover:-translate-y-px shadow-[0_10px_24px_rgba(37,99,235,0.22)]"
        >
          <svg class="w-[18px] h-[18px]" viewBox="0 0 18 18" fill="white">
            <path
              d="M13.2 9.6c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.6-1.3-.1-2.5.7-3.1.7-.7 0-1.7-.7-2.8-.7-1.4 0-2.8.8-3.5 2.1-1.5 2.6-.4 6.5 1.1 8.6.7 1 1.5 2.2 2.6 2.1 1-.1 1.4-.7 2.7-.7 1.2 0 1.6.7 2.7.6 1.1 0 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.3-.1 0-2.1-.8-2.1-3.6zM10.5 3.3c.6-.7 1-1.7.9-2.7-.9.1-1.9.6-2.5 1.3-.6.6-1 1.6-.9 2.5.9.1 1.9-.4 2.5-1.1z"
            />
          </svg>

          <div class="w-px h-[18px] bg-white/40"></div>

          App Store
        </a>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="relative flex items-center justify-center min-h-[560px] w-full">
      <!-- Phone frame -->
      <div
        class="relative z-10 w-[250px] sm:w-[270px] lg:w-[285px] xl:w-[300px] rounded-[36px] overflow-hidden"
      >
        <img src="/images/phone.png" alt="PayBuy App" class="w-full block" />
      </div>

      <!-- Amount card -->
      <div class="hero-amount-card">
        <div class="hero-check-badge">
          <svg class="w-3 h-3" viewBox="0 0 14 14" fill="none">
            <path
              d="M3 7l3 3 5-5"
              stroke="white"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <p class="text-[11px] text-gray-500 font-medium mb-1">Amount</p>

        <p class="text-xl sm:text-2xl font-extrabold text-[#0d1b2a] tracking-tight">
          $500,000.00
        </p>
      </div>

      <!-- Payment Protected -->
      <div class="hero-payment-protected">
        <span class="text-xs font-medium text-[#4a5568] whitespace-nowrap">
          Payment Protected
        </span>

        <div
          class="w-10 h-10 rounded-2xl bg-green-500/90 backdrop-blur-md border border-white/30 flex items-center justify-center shadow-[0_10px_30px_rgba(34,197,94,0.25)]"
        >
          <svg class="w-[18px] h-[18px]" viewBox="0 0 18 18" fill="none">
            <path
              d="M9 1.5L3 4V9C3 12.6 5.7 15.9 9 16.5C12.3 15.9 15 12.6 15 9V4L9 1.5Z"
              fill="white"
              opacity="0.95"
            />
            <path
              d="M6 9l2 2 4-4"
              stroke="#22c55e"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>

      <!-- Merchant card -->
      <div class="hero-merchant-card">
        <div
          class="w-9 h-9 bg-blue-600/90 rounded-xl flex items-center justify-center mb-3 shadow-[0_8px_20px_rgba(37,99,235,0.22)]"
        >
          <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none">
            <rect
              x="2"
              y="4"
              width="12"
              height="9"
              rx="2"
              stroke="white"
              stroke-width="1.3"
            />
            <path
              d="M5 4V3a3 3 0 016 0v1"
              stroke="white"
              stroke-width="1.3"
            />
            <circle cx="8" cy="9" r="1.2" fill="white" />
          </svg>
        </div>

        <p class="text-[10px] text-gray-500">To</p>

        <p class="text-[13px] font-bold text-[#0d1b2a]">
          Online Store
        </p>

        <p class="text-[10px] text-gray-500 mb-1.5">
          Merchant Account
        </p>

        <p class="text-[10px] text-gray-500">
          Status:
          <span class="text-green-500 font-semibold">Payment Received</span>
        </p>
      </div>
    </div>
  </div>
</section>
